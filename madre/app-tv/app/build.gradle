plugins {
    id 'com.android.application'
}

android {
    namespace 'es.pizarra.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'es.pizarra.tv'
        // La Philips 50PUH6400 trae Android 5.1.1 (API 22).
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
