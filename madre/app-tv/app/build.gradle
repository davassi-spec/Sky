plugins {
    id 'com.android.application'
}

android {
    namespace 'es.pizarra.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'es.pizarra.tv'
        // La Philips 50PUH6400 trae Android 5.1.1 (API 22).
        minSdk 21
        targetSdk 28
        versionCode 14
        versionName '6.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric baja su copia de Android desde este espejo de Maven Central
                systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
                systemProperty 'robolectric.dependency.repo.id', 'espejo'
                systemProperty 'capturas.dir', System.getProperty('capturas.dir') ?: "${buildDir}/capturas"
                maxHeapSize = '2g'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
