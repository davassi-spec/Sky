      accion('admAjustes', [{ nocheDesde: Number(desde.value), nocheHasta: Number(hasta.value), nocheTexto: ntexto.value, contactoNombre: cn.value, contactoTelefono: ct.value,
        ciudad: ciudad.nombre, latitud: ciudad.latitud, longitud: ciudad.longitud, calendarios: marcados }], 'Ajustes guardados', guardar);
    } }, 'Guardar ajustes');
    w.appendChild(guardar);
    return w;
  }

  /* ============================== Versión de familiar ============================== */
  /** Para los familiares: "Ver cómo se ve la tele ahora" (solo mirar; no cambia nada). */
  function cargarPrevia(silencioso) {
    return llamar('admVistaPrevia').then(function (p) { previa = p; pintar(); }, function (e) { if (!silencioso) aviso(mensajeError(e), 'error'); });
  }
  function tarjetaPrevia() {
    var t = el('div', { class: 'tarjeta', id: 'previa-tv' }, el('h2', {}, 'La pantalla de la tele'));
    if (!previa) {
      t.appendChild(el('p', { class: 'sub', style: 'margin:0' }, 'Si quieres, mira cómo se ve ahora en casa de mamá.'));
      var ver = el('button', { class: 'btn suave', type: 'button', style: 'margin-top:12px', onclick: function () { ver.disabled = true; cargarPrevia(false).then(function () { ver.disabled = false; }); } }, icono('pantalla'), 'Ver cómo se ve la tele');
      t.appendChild(ver);
      return t;
    }
    var m = modoDePrevia(previa);
    t.appendChild(miniatura(previa.vista, m.modo, m.estilo));
    if (m.prueba) t.appendChild(el('p', { class: 'ayuda' }, 'Ahora se está probando un estilo: la tele vuelve sola al suyo en menos de un minuto.'));
    t.appendChild(el('p', { class: 'ayuda' }, 'Es solo para mirar. Se actualiza sola cada 25 segundos.'));
    t.appendChild(el('div', { class: 'fila', style: 'margin-top:8px' },
      el('button', { class: 'btn suave', type: 'button', onclick: function (e) { e.currentTarget.disabled = true; cargarPrevia(false); } }, 'Actualizar'),
      el('button', { class: 'btn suave', type: 'button', onclick: function () { previa = null; pintar(); } }, 'Ocultar')));
    return t;
  }
  function vistaFamiliar() {
    var w = document.createDocumentFragment();
    w.appendChild(cabecera('Hola, ' + S.nombre, 'Lo que mandes aparece en la tele de mamá.'));
    w.appendChild(estadoTV());
    w.appendChild(tarjetaPrevia());
    var ta = el('textarea', { id: 'texto', maxlength: '200', placeholder: 'Hoy comemos juntos.', oninput: function (e) { borrador.texto = e.target.value; $('cuenta').textContent = e.target.value.length + '/200'; } });
    ta.value = borrador.texto;
    var chips = el('div', { class: 'chips' });
    FRASES.forEach(function (f) { chips.appendChild(el('button', { class: 'chip', type: 'button', onclick: function () { ta.value = f; borrador.texto = f; $('cuenta').textContent = f.length + '/200'; ta.focus(); } }, f)); });
    var dur = el('select', { id: 'duracion', onchange: function (e) { borrador.duracion = e.target.value; } },
      el('option', { value: 'hoy' }, 'Solo hoy (se quita a medianoche)'), el('option', { value: 'manana' }, 'Hoy y mañana'), el('option', { value: 'siempre' }, 'Hasta que yo lo quite'));
    dur.value = borrador.duracion;
    var enviar = el('button', { class: 'btn', type: 'button', style: 'margin-top:16px', onclick: function () {
      var t = borrador.texto.trim(); if (!t) { aviso('Escribe un mensaje', 'error'); return; }
      accion('admEnviar', [S.nombre, t, borrador.duracion], 'Enviado a la TV. Saldrá en menos de un minuto.', enviar).then(function () { borrador.texto = ''; pintar(); });
    } }, icono('enviar'), 'Enviar a la TV');
    w.appendChild(el('div', { class: 'tarjeta' }, el('h2', {}, 'Tu mensaje'), el('label', { class: 'eti', for: 'texto' }, 'Mensaje'), ta, el('div', { class: 'contador', id: 'cuenta' }, borrador.texto.length + '/200'),
      chips, el('label', { class: 'eti', for: 'duracion' }, '¿Cuánto tiempo se ve?'), dur, enviar));
    var miId = S.miId;
    w.appendChild(el('div', { class: 'tarjeta' }, el('h2', {}, 'Tu foto para la tele de mamá'),
      el('div', { class: 'item', style: 'padding:0;border:0;align-items:center' }, avatar(miId, S.nombre, S.tieneFoto, true),
        el('div', { class: 'cuerpo' }, el('p', { class: 'sub', style: 'margin:0' }, 'Sale junto a tus mensajes.'))),
      el('div', { class: 'fila', style: 'margin-top:12px' },
        el('button', { class: 'btn suave', type: 'button', onclick: function (e) { elegirFoto(null, e.currentTarget); } }, icono('camara'), S.tieneFoto ? 'Cambiar foto' : 'Poner foto'),
        S.tieneFoto ? el('button', { class: 'btn suave', type: 'button', onclick: function (e) { accion('admFotoQuitar', [null], 'Foto quitada', e.currentTarget).then(function () { delete fotos[miId]; pintar(); }); } }, 'Quitar foto') : null)));
    var mios = S.mensajes.slice().sort(function (a, b) { return b.t - a.t; }).slice(0, 20);
    var t = el('div', { class: 'tarjeta' }, el('h2', {}, 'Tus envíos'));
    if (!mios.length) t.appendChild(el('p', { class: 'vacio' }, 'Todavía no has enviado nada.'));
    var l = el('div', { class: 'lista' });
    mios.forEach(function (m) {
      l.appendChild(el('div', { class: 'item' }, el('div', { class: 'cuerpo' }, el('div', { class: 'texto' }, m.texto),
        el('div', { class: 'meta' }, cuando(m.t) + (activo(m) ? ' · En la TV · ' + hasta(m.hasta) : ' · Ya caducó')),
        activo(m) ? el('div', { class: 'acciones' }, el('button', { class: 'enlace peligro', type: 'button', 'aria-label': 'Quitar el mensaje: ' + m.texto, onclick: function () { accion('admBorrar', [m.id], 'Mensaje quitado de la tele'); } }, 'Quitar')) : null)));
    });
    t.appendChild(l); w.appendChild(t);
    return w;
  }

  /* ============================== arranque ============================== */
  function aplicarTema() {
    var t = leerLocal('tema');
    if (t) document.documentElement.setAttribute('data-tema', t); else document.documentElement.removeAttribute('data-tema');
  }
  function cargar(silencioso) {
    return llamar('admEstado').then(function (r) {
      S = r;
      if (ROL === 'familia' && !S.miId) S.miId = 'yo';
      if (r.rol === 'admin' && !r.datos.mensajes) r.datos.mensajes = [];
      pintar();
    }, function (e) { if (!silencioso) $('app').innerHTML = '<p class="vacio" style="padding-top:40px"></p>', $('app').firstChild.textContent = 'No se ha podido cargar: ' + mensajeError(e); });
  }
  /** Se actualiza solo cada 25 s, salvo que estés escribiendo. */
  function refrescar() {
    if (document.hidden) return;
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    cargar(true);
    if (ROL === 'familia' && previa) cargarPrevia(true);
  }
  aplicarTema();
  if (ROL === 'admin') { var v = leerLocal('vista'); if (v === 'inicio' || v === 'mensajes' || v === 'mas') vista = v; }
  cargar(false);
  setInterval(refrescar, 25000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescar(); });
</script>
</body>
</html>
