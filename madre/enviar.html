<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enviar mensaje</title>
<style>
  :root { --fondo:#f4f6fa; --texto:#14202f; --apagado:#5a6a80; --acento:#0b5bd3; --linea:#c9d3e0; --blanco:#fff; --ok:#17794a; --error:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#0e1a2b; --texto:#f5f8fc; --apagado:#aebdd1; --acento:#6aa6ff; --linea:#2a4062; --blanco:#172942; --ok:#5fd29a; --error:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto); font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--apagado); }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  textarea, input { width:100%; font:inherit; color:var(--texto); background:var(--blanco); border:2px solid var(--linea); border-radius:10px; padding:12px; }
  textarea { min-height:140px; resize:vertical; }
  textarea:focus, input:focus { outline:3px solid var(--acento); border-color:var(--acento); }
  .rapidos { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .rapidos button { font:inherit; padding:8px 12px; border-radius:999px; border:1px solid var(--linea); background:var(--blanco); color:var(--texto); cursor:pointer; }
  .enviar { margin-top:20px; width:100%; font:inherit; font-weight:700; padding:14px; border:0; border-radius:12px; background:var(--acento); color:#fff; cursor:pointer; }
  .enviar:disabled { opacity:.6; }
  #estado { min-height:1.5em; margin-top:14px; font-weight:600; }
  #estado.ok { color:var(--ok); } #estado.error { color:var(--error); }
  .borrar { margin-top:24px; font:inherit; background:none; border:0; color:var(--apagado); text-decoration:underline; cursor:pointer; padding:0; }
</style>
</head>
<body>
<main>
  <h1>Mensaje para la pantalla</h1>
  <p class="sub">Aparece en la tele en menos de un minuto. Mejor frases cortas.</p>
  <form id="f">
    <label for="texto">Mensaje</label>
    <textarea id="texto" maxlength="200" placeholder="Hoy viene Ana a las 5." required></textarea>
    <div class="rapidos" id="rapidos"></div>
    <label for="firma">Firma (opcional)</label>
    <input id="firma" placeholder="Ana" autocomplete="off">
    <button class="enviar" id="boton" type="submit">Enviar a la pantalla</button>
    <div id="estado" role="status"></div>
  </form>
  <button class="borrar" id="borrar" type="button">Borrar todos los mensajes de la pantalla</button>
</main>
<script src="config.js"></script>
<script>
(function () {
  var C = window.CONFIG || {};
  function dameTema() {
    var m = /[?&]tema=([^&#]+)/.exec(location.search), t = "";
    try {
      if (m) { t = decodeURIComponent(m[1]); localStorage.setItem("tema", t); }
      else { t = localStorage.getItem("tema") || ""; }
    } catch (e) { if (m) t = m[1]; }
    return t;
  }
  var TEMA = dameTema();
  var texto = document.getElementById("texto"), firma = document.getElementById("firma");
  var estado = document.getElementById("estado"), boton = document.getElementById("boton");
  try { firma.value = localStorage.getItem("firma") || ""; } catch (e) {}

  ["Hoy comemos juntos.", "Hoy viene alguien a verte.", "Te llamamos a las 6.", "Te queremos mucho."]
    .forEach(function (t) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = t;
      b.onclick = function () { texto.value = t; texto.focus(); };
      document.getElementById("rapidos").appendChild(b);
    });

  function mandar(mensaje, ok) {
    estado.className = ""; estado.textContent = "Enviando…"; boton.disabled = true;
    var x = new XMLHttpRequest();
    x.open("POST", "https://ntfy.sh/");
    x.setRequestHeader("Content-Type", "application/json");
    x.onload = function () {
      boton.disabled = false;
      if (x.status === 200) { estado.className = "ok"; estado.textContent = ok; }
      else { estado.className = "error"; estado.textContent = "No se pudo enviar (error " + x.status + ")."; }
    };
    x.onerror = function () { boton.disabled = false; estado.className = "error"; estado.textContent = "No hay conexión. Inténtalo de nuevo."; };
    x.send(JSON.stringify({ topic: TEMA, message: mensaje }));
  }

  document.getElementById("f").onsubmit = function (e) {
    e.preventDefault();
    if (!TEMA) { estado.className = "error"; estado.textContent = "Falta el tema: abre esta página con ?tema=… al final de la dirección."; return; }
    var t = texto.value.trim(); if (!t) return;
    var f = firma.value.trim();
    try { localStorage.setItem("firma", f); } catch (er) {}
    mandar(f ? t + " — " + f : t, "Enviado. Saldrá en la pantalla en menos de un minuto.");
    texto.value = "";
  };
  document.getElementById("borrar").onclick = function () {
    mandar("borrar", "Pedido de borrado enviado.");
  };
})();
</script>
</body>
</html>
