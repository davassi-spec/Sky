<!doctype html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La tele de mamá">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="manifest" id="manifiesto">
<title>La tele de mamá</title>
<style>
  /* Panel de la pizarra: estilo de los Ajustes del iPhone (listas agrupadas), letra del sistema y un solo acento azul. Claro y oscuro según el móvil. */
  :root {
    --fondo: #F2F2F7; --tarjeta: #FFFFFF; --tarjeta2: #F2F2F7; --barra: rgba(249,249,251,.88);
    --texto: #000000; --sub: #6C6C70; --borde: #E1E1E6;
    --primario: #0A66D6; --boton: #0A66D6; --sobre: #FFFFFF; --suave: #E7F0FC; --suave-texto: #0A66D6;
    --peligro: #C9170B; --peligro-fondo: #FCEBE9; --ok: #1E7B34; --ok-fondo: #E5F4E9;
    --aviso: #8A5A00; --aviso-fondo: #FBF0D9; --verde: #34C759;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="claro"]) {
      --fondo: #000000; --tarjeta: #1C1C1E; --tarjeta2: #2C2C2E; --barra: rgba(28,28,30,.88);
      --texto: #FFFFFF; --sub: #A1A1A8; --borde: #38383A;
      --primario: #4C9AFF; --suave: #112A4A; --suave-texto: #7DB6FF;
      --peligro: #FF8A80; --peligro-fondo: #3A1E1C; --ok: #7BD890; --ok-fondo: #17301D;
      --aviso: #F0C874; --aviso-fondo: #3A301A; color-scheme: dark;
    }
  }
  :root[data-tema="oscuro"] {
    --fondo: #000000; --tarjeta: #1C1C1E; --tarjeta2: #2C2C2E; --barra: rgba(28,28,30,.88);
    --texto: #FFFFFF; --sub: #A1A1A8; --borde: #38383A;
    --primario: #4C9AFF; --suave: #112A4A; --suave-texto: #7DB6FF;
    --peligro: #FF8A80; --peligro-fondo: #3A1E1C; --ok: #7BD890; --ok-fondo: #17301D;
    --aviso: #F0C874; --aviso-fondo: #3A301A; color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--fondo); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--texto); background: var(--fondo);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    padding-top: calc(52px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  }
  main { max-width: 560px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--primario); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* barra de arriba y de abajo */
  #barra { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); background: var(--barra);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--borde); }
  #barra .in { max-width: 560px; margin: 0 auto; height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 max(8px, env(safe-area-inset-left, 0px)); }
  #barra .t { font-weight: 600; font-size: 17px; text-align: center; }
  #barra .izq { justify-self: start; } #barra .der { justify-self: end; }
  .atras, .icono-barra { display: inline-flex; align-items: center; gap: 2px; min-height: 48px; min-width: 48px; padding: 0 8px; background: none; border: 0; color: var(--primario); font-size: 17px; cursor: pointer; }
  .icono-barra { justify-content: center; } .icono-barra svg { width: 26px; height: 26px; }
  .atras svg { width: 22px; height: 22px; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--barra); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--borde); padding: 4px max(8px, env(safe-area-inset-left, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)); }
  .nav ul { list-style: none; margin: 0 auto; padding: 0; max-width: 560px; display: grid; grid-template-columns: repeat(3, 1fr); }
  .nav button { width: 100%; min-height: 52px; border: 0; background: none; color: var(--sub); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; cursor: pointer; }
  .nav button[aria-current="page"] { color: var(--primario); }
  .nav svg { width: 26px; height: 26px; }

  /* secciones y listas agrupadas */
  .seccion { margin-top: 24px; }
  .seccion:first-child { margin-top: 8px; }
  .seccion-t { font-size: 13px; text-transform: uppercase; color: var(--sub); padding: 0 16px 6px; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: center; }
  .seccion-p { font-size: 13px; color: var(--sub); padding: 6px 16px 0; }
  .insignia { background: var(--tarjeta2); color: var(--sub); border-radius: 10px; padding: 0 8px; font-size: 13px; min-width: 22px; text-align: center; }
  .grupo, .tarjeta { background: var(--tarjeta); border-radius: 12px; overflow: hidden; }
  .tarjeta { padding: 16px; margin-top: 16px; }
  .tarjeta > h2:first-child { font-size: 13px; text-transform: uppercase; color: var(--sub); font-weight: 400; letter-spacing: .02em; margin: 0 0 10px; }
  .fl { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; width: 100%; background: none; border: 0; text-align: left; color: inherit; position: relative; }
  .fl + .fl::before, .item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--borde); }
  button.fl { cursor: pointer; }
  .fl .t { flex: 1; min-width: 0; }
  .fl .t small { display: block; font-size: 14px; color: var(--sub); }
  .fl .ico { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--primario); flex: none; }
  .fl .ico svg { width: 24px; height: 24px; }
  .fl .valor { color: var(--sub); }
  .fl .flecha, .flecha { color: var(--sub); width: 18px; height: 18px; flex: none; opacity: .7; }
  .fl select { width: auto; max-width: 62%; min-height: 44px; margin-left: auto; padding: 0 4px; background: none; border: 0; color: var(--sub); text-align: right; text-align-last: right; -webkit-appearance: none; appearance: none; font-size: 17px; }
  .fl input[type=text], .fl input[type=time] { width: auto; flex: 1; min-height: 44px; padding: 0; background: none; border: 0; text-align: right; color: var(--primario); font-size: 17px; }
  .fl input::placeholder { color: var(--sub); }

  label.eti { display: block; font-size: 13px; text-transform: uppercase; color: var(--sub); margin: 14px 0 6px; }
  label.eti:first-child { margin-top: 0; }
  input[type=text], input[type=tel], input[type=date], input[type=time], input[type=email], input[type=url], select, textarea {
    width: 100%; min-height: 48px; padding: 10px 12px; background: var(--tarjeta2); border: 0; border-radius: 10px;
  }
  .grupo textarea, .grupo .caja { background: none; border-radius: 0; padding: 14px 16px 4px; min-height: 120px; }
  textarea { min-height: 112px; resize: vertical; }
  textarea:focus-visible, input:focus-visible { outline-offset: -2px; }
  .contador { color: var(--sub); font-size: 13px; }
  .ayuda { color: var(--sub); font-size: 14px; margin-top: 8px; }
  .sub, .intro { color: var(--sub); font-size: 14px; padding: 0 16px; margin-top: 4px; }

  /* botones */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 12px 18px; border: 0; border-radius: 12px; font-weight: 600; cursor: pointer; background: var(--boton); color: #fff; }
  .btn.suave { background: var(--suave); color: var(--suave-texto); }
  .btn.borde { background: transparent; color: var(--primario); border: 1.5px solid var(--primario); }
  .btn.peligro { background: var(--peligro-fondo); color: var(--peligro); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn + .btn { margin-top: 10px; }
  .fila { display: flex; gap: 10px; }
  .fila > * { flex: 1; min-width: 0; }
  .fila > .btn { margin-top: 0; }
  .enlace { background: none; border: 0; min-height: 48px; padding: 0 10px; font-weight: 500; color: var(--primario); cursor: pointer; }
  .enlace.peligro { color: var(--peligro); }
  .pastilla { min-height: 48px; padding: 0 18px; border-radius: 24px; border: 0; background: var(--peligro-fondo); color: var(--peligro); font-weight: 600; cursor: pointer; }
  .pastilla.azul { background: var(--suave); color: var(--suave-texto); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 14px; }
  .chip { min-height: 44px; padding: 8px 14px; border-radius: 22px; border: 0; background: var(--suave); color: var(--suave-texto); cursor: pointer; }
  .segmentos { display: grid; grid-template-columns: 1fr 1fr; background: var(--tarjeta2); border-radius: 10px; padding: 2px; gap: 2px; margin-top: 8px; }
  .segmentos button { min-height: 44px; border-radius: 8px; border: 0; background: none; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .segmentos button[aria-pressed="true"] { background: var(--tarjeta); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
  .segmentos svg { width: 18px; height: 18px; }

  .estado { display: inline-flex; align-items: center; gap: 10px; }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--sub); flex: none; display: inline-block; }
  .punto.on { background: var(--verde); }
  .punto.off { background: #D9453B; }
  .punto.esp { background: #E0A100; }

  /* lo que se ve ahora en la tele */
  .ahora { padding: 12px; }
  .miniatura { border-radius: 8px; overflow: hidden; position: relative; background: #000; }
  .miniatura .pantalla { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; overflow: hidden; }
  .captura { width: 100%; display: block; border-radius: 8px; aspect-ratio: 16 / 9; background: #000; }
  .ahora + .grupo { margin-top: 8px; }
  .controles { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 8px; margin-top: 10px; }
  .controles > * { min-height: 56px; border: 0; border-radius: 12px; background: var(--tarjeta2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: var(--texto); cursor: pointer; }
  .controles button:disabled { opacity: .4; cursor: default; }
  .controles svg { width: 22px; height: 22px; }
  .controles .quitar { color: var(--peligro); background: var(--peligro-fondo); }
  .controles .vol { flex-direction: row; justify-content: space-between; padding: 0 4px; cursor: default; }
  .controles .vol button { border: 0; min-width: 48px; min-height: 52px; background: none; flex-direction: row; font-size: 24px; color: var(--primario); }
  .estado-repro { display: flex; align-items: center; gap: 10px; }

  /* filas con avatar */
  .lista { display: flex; flex-direction: column; }
  .item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; position: relative; }
  .item .cuerpo { flex: 1; min-width: 0; }
  .item .quien { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .item .quien .hora { color: var(--sub); font-weight: 400; font-size: 14px; }
  .item .texto { overflow-wrap: anywhere; }
  .item .meta { font-size: 14px; color: var(--sub); margin-top: 2px; }
  .item .acciones { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; justify-content: flex-end; }
  .tarjeta .item { padding-left: 0; padding-right: 0; }
  .tarjeta .item + .item::before { left: 0; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--suave); color: var(--suave-texto); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; flex: none; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.grande { width: 60px; height: 60px; font-size: 26px; }
  .avatar svg { width: 22px; height: 22px; }
  .estado-pila { display: inline-block; padding: 1px 10px; border-radius: 12px; font-size: 13px; background: var(--ok-fondo); color: var(--ok); font-weight: 500; }
  .estado-pila.gris { background: var(--tarjeta2); color: var(--sub); }
  .estado-pila.azul { background: var(--suave); color: var(--suave-texto); }
  .error-inline { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; background: var(--peligro-fondo); color: var(--peligro); border-radius: 12px; padding: 12px 14px; margin-top: 8px; font-size: 15px; }
  .error-inline[hidden] { display: none; }
  .mini-medio { width: 56px; height: 56px; border-radius: 10px; background: var(--suave); color: var(--suave-texto); display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; position: relative; }
  .mini-medio img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini-medio svg { width: 26px; height: 26px; }
  .mini-medio .play { position: absolute; inset: auto 3px 3px auto; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: flex; align-items: center; justify-content: center; }
  .mini-medio .play svg { width: 12px; height: 12px; }
  .estado-pila.fijo { background: var(--aviso-fondo); color: var(--aviso); }
  .deshacer { margin-left: auto; background: none; border: 0; min-height: 44px; padding: 0 6px; color: var(--primario); font-weight: 700; cursor: pointer; }
  .guardado-nota { color: var(--sub); font-size: 13px; padding: 6px 16px 0; }
  .programado { color: var(--primario); font-weight: 500; }
  .vacio { color: var(--sub); padding: 14px 16px; }
  .dia-t { font-size: 13px; text-transform: uppercase; color: var(--sub); padding: 18px 16px 6px; }

  .mic { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--boton); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .mic svg { width: 26px; height: 26px; }
  .mic.grabando { background: #D9453B; transform: scale(1.12); }
  .compositor-pie { display: flex; align-items: center; gap: 12px; padding: 4px 16px 12px; }
  .compositor-pie .t { flex: 1; font-size: 13px; color: var(--sub); }
  #nota { position: fixed; left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 45; max-width: 536px; margin: 0 auto; border-radius: 16px; background: var(--tarjeta); padding: 14px 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25); display: flex; align-items: center; gap: 12px; }
  #nota .rojo { width: 14px; height: 14px; border-radius: 50%; background: #D9453B; animation: lat 1s infinite; flex: none; }
  #nota b { font-variant-numeric: tabular-nums; font-size: 20px; }
  #nota span { color: var(--sub); font-size: 14px; }
  #nota.cancelar { background: var(--peligro-fondo); }
  @keyframes lat { 50% { opacity: .25; } }

  .envio { position: sticky; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 5; margin: 20px -16px 0; padding: 10px 16px 12px; background: var(--fondo); }
  .envio .btn { min-height: 54px; font-size: 17px; }

  /* interruptores y ajustes antiguos (Pantalla, Recordatorios, Familia, Ajustes) */
  .menu { padding: 0; }
  .menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 16px; background: none; border: 0; text-align: left; cursor: pointer; position: relative; }
  .menu button + button::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--borde); }
  .menu .ico { width: 30px; height: 30px; color: var(--primario); display: flex; align-items: center; justify-content: center; flex: none; }
  .menu .ico svg { width: 24px; height: 24px; }
  .menu .t { flex: 1; } .menu .t small { display: block; color: var(--sub); font-size: 14px; }
  .menu .flecha { color: var(--sub); width: 18px; height: 18px; opacity: .7; }
  .tarjeta.menu { padding: 0; margin-top: 16px; }
  .interruptor { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 0; position: relative; }
  .interruptor + .interruptor::before, .bloque + .bloque::before { content: ""; position: absolute; top: 0; left: 0; right: 0; border-top: .5px solid var(--borde); }
  .interruptor .ico { width: 28px; height: 28px; color: var(--primario); display: flex; align-items: center; justify-content: center; flex: none; }
  .interruptor .ico svg { width: 22px; height: 22px; }
  .interruptor .t { flex: 1; min-width: 0; }
  .interruptor .t small { display: block; color: var(--sub); font-size: 14px; }
  .sw { position: relative; width: 56px; height: 48px; border: 0; background: none; padding: 0; cursor: pointer; flex: none; }
  .sw::before { content: ""; position: absolute; left: 3px; top: 9px; width: 51px; height: 31px; border-radius: 16px; background: #C7C7CC; transition: background .15s; }
  .sw::after { content: ""; position: absolute; left: 5px; top: 11px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  .sw[aria-checked="true"]::before { background: var(--verde); }
  .sw[aria-checked="true"]::after { transform: translateX(20px); }
  .bloque { padding: 10px 0; position: relative; display: flex; align-items: center; gap: 8px; }
  .bloque-t { display: flex; gap: 12px; align-items: center; flex: 1; }
  .bloque-t .ico { width: 28px; height: 28px; color: var(--primario); display: flex; align-items: center; justify-content: center; flex: none; }
  .bloque-t .ico svg { width: 22px; height: 22px; }
  .bloque-t .t { flex: 1; min-width: 0; } .bloque-t .t small { display: block; color: var(--sub); font-size: 14px; }
  .bloque-c { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  #ahora-modo { margin-top: 10px; }
  .estilos { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .estilo { border: 2px solid transparent; border-radius: 12px; padding: 0; background: none; cursor: pointer; text-align: center; font-weight: 500; }
  .estilo[aria-pressed="true"] { border-color: var(--primario); }
  .estilo .mini { display: block; height: 66px; border-radius: 10px 10px 0 0; padding: 8px; position: relative; overflow: hidden; }
  .estilo .mini i { display: block; height: 22px; border-radius: 6px; margin-bottom: 5px; }
  .estilo .mini b { position: absolute; left: 10px; bottom: 6px; font-size: 18px; line-height: 1; }
  .estilo .mini u { position: absolute; right: 10px; bottom: 9px; width: 24px; height: 8px; border-radius: 4px; }
  .estilo span { display: block; padding: 8px 4px; background: var(--tarjeta2); border-radius: 0 0 10px 10px; font-size: 15px; }
  .dists { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .dist { border: 2px solid transparent; border-radius: 12px; padding: 0; background: var(--tarjeta2); cursor: pointer; text-align: center; font-weight: 500; overflow: hidden; }
  .dist[aria-pressed="true"] { border-color: var(--primario); }
  .dist img { display: block; width: 100%; height: auto; }
  .dist span { display: block; padding: 8px 4px; font-size: 15px; }

  .ayuda-icono { margin-top: 12px; font-size: 16px; }
  .ayuda-icono summary { cursor: pointer; font-weight: 500; color: var(--primario); min-height: 44px; display: flex; align-items: center; }
  .ayuda-icono p { margin: 8px 0 0; }
  .barra-subida { height: 8px; border-radius: 4px; background: var(--tarjeta2); overflow: hidden; margin-top: 10px; --pct: 0%; }
  .barra-subida::after { content: ''; display: block; height: 100%; width: var(--pct); background: var(--primario); transition: width .3s; }
  .cuenta-grab { font-size: 22px; font-weight: 700; text-align: center; margin: 12px 0 4px; }

  #aviso { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: 528px; margin: 0 auto; padding: 12px 16px; border-radius: 14px; font-weight: 500; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  #aviso.ok { display: flex; align-items: center; gap: 8px; background: var(--tarjeta); color: var(--texto); border: .5px solid var(--borde); }
  #aviso.error { display: block; background: var(--peligro-fondo); color: var(--peligro); }
  .velo { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }

  var ORDEN_ESTILOS = ['calido', 'lavanda', 'salvia', 'terracota', 'contraste'];

  /* ============================== fotos ============================== */
  function iniciales(n) { return (n || '?').trim().charAt(0).toUpperCase() || '?'; }
  /** Círculo con la foto de la persona (se pide al servidor solo cuando hace falta) o con su inicial. */
  function avatar(personaId, nombre, tieneFoto, grande) {
    var a = el('div', { class: 'avatar' + (grande ? ' grande' : ''), 'data-persona': personaId || '' }, iniciales(nombre));
    if (tieneFoto && personaId) {
      if (fotos[personaId]) ponerFoto(a, fotos[personaId]);
      else if (fotos[personaId] === undefined) {
        if (!fotosPidiendo[personaId]) {
          fotosPidiendo[personaId] = llamar('admLeerFoto', personaId).then(function (d) { fotos[personaId] = d || null; delete fotosPidiendo[personaId]; return d; },
            function () { delete fotosPidiendo[personaId]; return null; });

        fotosPidiendo[personaId].then(function (d) { if (d && a.isConnected) ponerFoto(a, d); });
      }
    }
    return a;
  }
  function ponerFoto(a, url) { a.innerHTML = ''; a.appendChild(el('img', { src: url, alt: '' })); }

  /** Reduce la foto a un cuadrado de 512 px (JPEG) antes de subirla. */
  function reducirFoto(archivo) {
    return new Promise(function (ok, ko) {
      var url = URL.createObjectURL(archivo), img = new Image();
      img.onload = function () {
        var lado = Math.min(img.naturalWidth, img.naturalHeight), tam = Math.min(512, lado);
        var c = document.createElement('canvas'); c.width = tam; c.height = tam;
        c.getContext('2d').drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, tam, tam);
        var q = 0.85, out = c.toDataURL('image/jpeg', q);
        while (out.length > 400000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(url); ok(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); ko(new Error('No se ha podido leer esa foto')); };
      img.src = url;
    });
  }
  /** JPEG de a lo sumo `max` px por el lado largo, sin deformar (para la foto de un recordatorio). */
  function reducirFotoLibre(archivo, max) {
    return new Promise(function (ok, ko) {
      var url = URL.createObjectURL(archivo), img = new Image();
      img.onload = function () {
        var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var q = 0.85, out = c.toDataURL('image/jpeg', q);
        while (out.length > 400000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(url); ok(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); ko(new Error('No se ha podido leer esa foto')); };
      img.src = url;
    });
  }

  /** Diálogo para encuadrar la cara en un círculo: se arrastra la foto y se acerca con el deslizador. Devuelve un JPEG cuadrado de 512 px. */
  function recortarCirculo(archivo) {

    return new Promise(function (ok, ko) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { ko(new Error('No se ha podido leer el archivo')); };
      r.readAsDataURL(blob);
    });
  }
  function conReintentos(fn, veces) {
    return fn().catch(function (e) { if (veces <= 0) throw e; return new Promise(function (r) { setTimeout(r, 800); }).then(function () { return conReintentos(fn, veces - 1); }); });
  }
  function subirMedio(blob, tipo, texto, alAvanzar, seg) {
    var mime = String(blob.type || '').split(';')[0], partes = Math.max(1, Math.ceil(blob.size / TROZO));
    return miniDe(blob, tipo).then(function (mini) {
      return llamar('admMedioNuevo', { tipo: tipo, mime: mime, bytes: blob.size, partes: partes, texto: texto || '', seg: seg || 0, mini: mini, de: borrador.de || leerLocal('de') });
    }).then(function (r) {
      var id = r.id, n = 0;
      var siguiente = function () {
        if (n >= partes) return llamar('admMedioFin', id);
        return trozoB64(blob.slice(n * TROZO, (n + 1) * TROZO)).then(function (b64) {
          return conReintentos(function () { return llamar('admMedioParte', id, n, b64); }, 2);
        }).then(function () { n++; alAvanzar(n / partes); return siguiente(); });
      };
      return siguiente();
    });
  }

  /* ---- diálogos ---- */
  function abrirDialogo(contenido) {
    var capa = $('capa');
    capa.innerHTML = '';
    capa.appendChild(el('div', { class: 'velo' }, el.apply(null, ['div', { class: 'dialogo', role: 'dialog', 'aria-modal': 'true' }].concat(contenido))));
  }
  function cerrarDialogo() { $('capa').innerHTML = ''; }

  /** Ver y escuchar lo que se va a mandar, y mandarlo. */
  function dialogoRevisar(blob, tipo, segs) {
    var url = URL.createObjectURL(blob), vista, seg = segs || 0;
    if (tipo === 'foto') vista = el('img', { src: url, alt: 'La foto que vas a mandar', style: 'width:100%;border-radius:12px;max-height:50vh;object-fit:contain;background:#000' });
    else if (tipo === 'video') vista = el('video', { src: url, controls: true, playsinline: true, style: 'width:100%;border-radius:14px;max-height:50vh;background:#000' });
    else vista = el('audio', { src: url, controls: true, style: 'width:100%' });
    if (tipo === 'video') vista.addEventListener('loadedmetadata', function () { if (isFinite(vista.duration) && vista.duration > 0) seg = vista.duration; });
    var texto = tipo === 'foto' ? el('input', { type: 'text', id: 'medio-texto', maxlength: '200', placeholder: 'Un mensaje con la foto (si quieres)', 'aria-label': 'Mensaje con la foto' }) : null;
    var barra = el('div', { class: 'barra-subida', hidden: true, 'aria-live': 'polite' });
    var estado = el('p', { class: 'sub', id: 'medio-estado' }, 'Mírala' + (tipo === 'foto' ? '' : ' o escúchala') + ' antes de mandarla.');
    var enviar = el('button', { class: 'btn', type: 'button' }, icono('enviar'), 'Mandar a la tele');
    var cancelar = el('button', { class: 'btn suave', type: 'button', onclick: function () { URL.revokeObjectURL(url); cerrarDialogo(); } }, 'Cancelar');
    enviar.onclick = function () {
      enviar.disabled = cancelar.disabled = true; barra.hidden = false;
      estado.textContent = 'Subiendo… no cierres esta pantalla.';
      subirMedio(blob, tipo, texto ? texto.value : '', function (f) { barra.style.setProperty('--pct', Math.round(f * 100) + '%'); estado.textContent = 'Subiendo… ' + Math.round(f * 100) + ' %'; }, seg).then(function (r) {
        URL.revokeObjectURL(url); cerrarDialogo();
        if (r && r.rol) { S = r; pintar(); }
        aviso('Listo. Está preparado: tú decides cuándo se ve en la tele.', 'ok');
      }, function (e) {
        enviar.disabled = cancelar.disabled = false; barra.hidden = true;
        estado.textContent = errorLegible(e);
        aviso(errorLegible(e), 'error');
      });
    };
    abrirDialogo([el('h2', {}, tipo === 'foto' ? 'Mandar esta foto' : tipo === 'video' ? 'Mandar este vídeo' : 'Mandar este audio'), vista, texto, estado, barra,
      el('div', { class: 'fila', style: 'margin-top:12px' }, cancelar, enviar)]);
  }

  function mimeGrabacion(tipo) {
    if (!window.MediaRecorder) return null;
    var cand = tipo === 'video' ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp8', 'video/webm']
      : ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < cand.length; i++) { try { if (MediaRecorder.isTypeSupported(cand[i])) return cand[i]; } catch (e) {} }
    return '';
  }
  /** Elegir un archivo de la galería (o abrir la cámara del móvil con capture). */
  function pedirArchivo(accept, capture) {
    return new Promise(function (ok) {
      var i = el('input', { type: 'file', accept: accept, capture: capture || null, style: 'position:fixed;left:-999px' });
      i.onchange = function () { var f = i.files && i.files[0]; i.remove(); ok(f || null); };
      document.body.appendChild(i); i.click();
    });
  }
  function procesarArchivo(f) {
    if (!f) return;
    aviso('Preparando…', 'ok');
    prepararArchivo(f).then(function (r) { dialogoRevisar(r.blob, r.tipo); }, function (e) { errorEn('err-contenido', errorLegible(e)); });
  }

  /** Grabar con el micrófono o la cámara del móvil, con cuenta atrás hasta el máximo. */
  function dialogoGrabar(tipo) {
    var max = tipo === 'video' ? MAX_VIDEO_S : MAX_AUDIO_S, flujo = null, rec = null, trozos = [], reloj = null, seg = 0, mime = mimeGrabacion(tipo);
    var titulo = el('h2', {}, tipo === 'video' ? 'Grabar un vídeo' : 'Grabar un audio');
    var vista = tipo === 'video' ? el('video', { muted: true, playsinline: true, autoplay: true, style: 'width:100%;border-radius:14px;background:#000;max-height:45vh', hidden: true }) : null;
    if (vista) vista.muted = true;
    var cuenta = el('div', { class: 'cuenta-grab', 'aria-live': 'polite' }, 'Máximo ' + (tipo === 'video' ? '30 segundos' : '1 minuto'));
    var msg = el('p', { class: 'sub' }, '');
    var empezar = el('button', { class: 'btn', type: 'button' }, icono(tipo === 'video' ? 'video' : 'micro'), 'Empezar a grabar');
    var parar = el('button', { class: 'btn peligro', type: 'button', hidden: true }, 'Parar y revisar');
    var cancelar = el('button', { class: 'btn suave', type: 'button' }, 'Cancelar');
    var soltar = function () { clearInterval(reloj); if (flujo) flujo.getTracks().forEach(function (t) { t.stop(); }); flujo = null; };
    cancelar.onclick = function () { if (rec && rec.state === 'recording') { rec.onstop = null; try { rec.stop(); } catch (e) {} } soltar(); cerrarDialogo(); };
    var alternativa = function (txt) {
      msg.textContent = txt;
      var galeria = el('button', { class: 'btn suave', type: 'button', onclick: function () { soltar(); cerrarDialogo(); pedirArchivo(tipo === 'video' ? 'video/*' : 'audio/*', tipo === 'video' ? 'user' : null).then(procesarArchivo); } },
        icono('camara'), tipo === 'video' ? 'Usar la cámara del móvil' : 'Elegir un audio del móvil');
      empezar.replaceWith(galeria);
      if (!EN_APP) msg.after(botonAbrirApp());
    };
    empezar.onclick = function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || mime === null) { alternativa('Este navegador no deja grabar desde aquí. Puedes usar lo que ya tengas en el móvil.'); return; }
      empezar.disabled = true;
      navigator.mediaDevices.getUserMedia(tipo === 'video' ? { audio: true, video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 540 } } } : { audio: true }).then(function (f) {
        flujo = f;
        if (vista) { vista.hidden = false; vista.srcObject = f; try { vista.play(); } catch (e) {} }
        var op = mime ? { mimeType: mime } : {};
        if (tipo === 'video') op.videoBitsPerSecond = 2000000;
        rec = new MediaRecorder(f, op);
        rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) trozos.push(ev.data); };
        rec.onstop = function () {
          soltar();
          var tipoReal = (rec.mimeType || mime || (tipo === 'video' ? 'video/mp4' : 'audio/mp4')).split(';')[0];
          var blob = new Blob(trozos, { type: tipoReal });
          cerrarDialogo();
          if (!blob.size) { errorEn('err-contenido', 'No se ha grabado nada. Prueba otra vez.'); return; }
          if (tipo === 'audio') { aviso('Preparando el audio…', 'ok'); aWav(blob).then(function (w) { dialogoRevisar(w, 'audio'); }, function (e) { errorEn('err-contenido', errorLegible(e)); }); }
          else esHEVC(blob).then(function (hevc) { return hevc ? comprobarVideo(blob) : blob; }).then(function (b) { dialogoRevisar(b, 'video', seg); }, function (e) { errorEn('err-contenido', errorLegible(e)); });
        };
        rec.start(1000);
        empezar.hidden = true; parar.hidden = false; msg.textContent = tipo === 'video' ? 'Grabando… habla a la cámara.' : 'Grabando… habla cerca del micrófono.';
        reloj = setInterval(function () {
          seg++; cuenta.textContent = 'Grabando: ' + seg + ' s de ' + max;
          if (seg >= max && rec.state === 'recording') rec.stop();
        }, 1000);
      }, function (e) {
        alternativa(e && /Denied|NotAllowed|Permission/i.test(e.name + e.message)
          ? 'No hay permiso para el ' + (tipo === 'video' ? 'cámara y micrófono' : 'micrófono') + '. Actívalo en los ajustes del navegador, o usa lo que ya tengas en el móvil.'
          : 'No se ha podido usar el ' + (tipo === 'video' ? 'cámara y micrófono' : 'micrófono') + ' desde aquí. Puedes usar lo que ya tengas en el móvil.');
      });
    };
    parar.onclick = function () { if (rec && rec.state === 'recording') rec.stop(); };
    if (EN_IFRAME && !EN_APP) { msg.textContent = 'Desde esta página el móvil suele bloquear el micrófono y la cámara. Con la app sí deja grabar.'; }
    abrirDialogo([titulo, vista, cuenta, msg, EN_IFRAME && !EN_APP ? botonAbrirApp() : null, el('div', { class: 'fila', style: 'margin-top:12px' }, cancelar, empezar, parar)]);
  }

  /** Mientras algo se pone en la tele, el estado se mira cada 3 segundos (y solo eso: es una llamada ligera). */
  function sondearMedios() {
    return llamar('admMediosEstado').then(function (r) {
      var f = JSON.stringify(r.medios);
      S.medios = r.medios; if (r.histMedios) S.histMedios = r.histMedios; S.tv = r.tv;
      if (f !== mediosFirma) { mediosFirma = f; pintar(); }
      programarSondeo();
    }, function () { programarSondeo(); });
  }
  function programarSondeo() {
    clearTimeout(mediosTimer);
    if (S && S.medios && pendienteRepro(S.medios.repro)) mediosTimer = setTimeout(function () { if (!document.hidden) sondearMedios(); else programarSondeo(); }, 3000);
  }

  /* ============================== arranque ============================== */
  function aplicarTema() {
    var t = leerLocal('tema');
    if (t) document.documentElement.setAttribute('data-tema', t); else document.documentElement.removeAttribute('data-tema');
  }
  function cargar(silencioso) {
    return llamar('admEstado').then(function (r) {
      S = r;
      if (!ROL) { ROL = r.rol; if (ROL === 'admin') { var v0 = leerLocal('vista'); if (v0 === 'inicio' || v0 === 'mensajes' || v0 === 'mas') vista = v0; } }
      if (EN_APP && r.rol === 'admin' && r.datos.enlaceApp !== window.PIZARRA.envoltorio) llamar('admAjustes', { enlaceApp: window.PIZARRA.envoltorio }).then(function (n) { if (n && n.datos) S.datos.enlaceApp = n.datos.enlaceApp; }, function () {});
      if (ROL === 'familia' && !S.miId) S.miId = 'yo';
      if (r.rol === 'admin' && !r.datos.mensajes) r.datos.mensajes = [];
      pintar();
      programarSondeo();
    }, function (e) { if (!silencioso) $('app').innerHTML = '<p class="vacio" style="padding-top:40px"></p>', $('app').firstChild.textContent = 'No se ha podido cargar: ' + mensajeError(e); });
  }
  /** Se actualiza solo cada 25 s, salvo que estés escribiendo. */
  function refrescar() {
    if (document.hidden) return;
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    cargar(true);
    if (ROL === 'familia' && previa) cargarPrevia(true);
  }
  /** La app se abre sin su enlace (pasa a veces al añadirla a la pantalla de inicio): se pide pegarlo una vez. */
  function sinClave() {
    var campo = el('textarea', { id: 'pegar-enlace', placeholder: 'Pega aquí el enlace que te mandaron', 'aria-label': 'Enlace', style: 'min-height:96px' });
    var ir_ = el('button', { class: 'btn', type: 'button', style: 'margin-top:12px', onclick: function () {
      var t = campo.value.trim(), id = /\/s\/([^\/?#]+)\/exec/.exec(t) || /[#&?]u=([^&\s]+)/.exec(t), k = /[#&?]k=([^&\s]+)/.exec(t);
      if (!id || !k) { aviso('Ese enlace no vale. Cópialo entero, tal como te llegó.', 'error'); return; }
      try { localStorage.setItem('pizarra_u', id[1]); localStorage.setItem('pizarra_k', k[1]); } catch (e) {}
      location.hash = 'u=' + id[1] + '&k=' + k[1];
      location.reload();
    } }, 'Entrar');
    $('app').appendChild(el('div', { class: 'tarjeta' }, el('h1', {}, 'La tele de mamá'), el('p', { class: 'sub' }, 'Falta el enlace personal. Pégalo una vez y ya queda guardado.'), campo, ir_));
  }
  aplicarTema();
  if (ROL === 'admin') { var v = leerLocal('vista'); if (v === 'inicio' || v === 'mensajes' || v === 'mas') vista = v; }
  if (K) cargar(false); else sinClave();
  setInterval(refrescar, 25000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescar(); });
</script>
