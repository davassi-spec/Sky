<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantalla de casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Pantalla de pared para la TV: letra enorme, contraste alto, nada que tocar.
     Izquierda: día, hora y tiempo. Derecha: los mensajes de la familia. */
  :root {
    --fondo: #0e1a2b;
    --panel: #172942;
    --texto: #f5f8fc;
    --apagado: #aebdd1;
    --acento: #ffc857;
    --linea: #2a4062;
    --letra: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: var(--letra);
    overflow: hidden;
    cursor: none;
  }
  .pantalla {
    height: 100%;
    display: grid;
    grid-template-columns: 38% 1fr;
    gap: 3vw;
    padding: 4vh 4vw;
  }
  .reloj { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .saludo { font-size: 3.4vh; color: var(--acento); font-weight: 700; margin: 0 0 1.5vh; }
  .dia { font-size: 10vh; line-height: 1.02; font-weight: 700; margin: 0; }
  .fecha { font-size: 4.6vh; color: var(--apagado); margin: 1.5vh 0 0; }
  .hora { font-size: 17vh; line-height: 1; font-weight: 700; margin: 3vh 0 0; font-variant-numeric: tabular-nums; }
  .momento { font-size: 4vh; color: var(--apagado); margin: 1vh 0 0; }

  .tiempo {
    display: flex; align-items: center; gap: 2.4vw;
    padding: 2.4vh 2vw; border-top: 2px solid var(--linea);
  }
  .tiempo svg { width: 11vh; height: 11vh; flex: none; }
  .tiempo .grados { font-size: 8.5vh; font-weight: 700; line-height: 1; }
  .tiempo .estado { font-size: 3.6vh; margin: 0.6vh 0 0; }
  .tiempo .rango { font-size: 3vh; color: var(--apagado); margin: 0.4vh 0 0; }

  .mensajes { display: flex; flex-direction: column; gap: 2.4vh; min-width: 0; min-height: 0; }
  .mensaje {
    background: var(--panel);
    border-radius: 2vh;
    padding: 3.4vh 3vw;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 0;
  }
  .mensaje.nuevo { flex: 1 1 auto; border-left: 1.2vh solid var(--acento); }
  .mensaje.viejo { flex: 0 0 auto; opacity: 0.82; }
  .mensaje .texto { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
  .mensaje.nuevo .texto { font-size: 8vh; line-height: 1.12; }
  .mensaje.viejo .texto { font-size: 4.2vh; line-height: 1.2; }
  .mensaje .cuando { margin: 1.6vh 0 0; font-size: 3vh; color: var(--apagado); }
  .vacio .texto { color: var(--apagado); font-weight: 400; font-size: 5vh; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .pantalla { grid-template-columns: 1fr; height: auto; min-height: 100%; }
    .dia { font-size: 8vw; } .hora { font-size: 18vw; } .fecha, .momento { font-size: 5vw; }
    .saludo { font-size: 4.4vw; }
    .mensaje.nuevo .texto { font-size: 8vw; } .mensaje.viejo .texto { font-size: 5vw; }
    .mensaje .cuando { font-size: 4vw; }
    .tiempo { flex-wrap: wrap; } .tiempo svg { width: 18vw; height: 18vw; }
    .tiempo .grados { font-size: 12vw; } .tiempo .estado { font-size: 5vw; } .tiempo .rango { font-size: 4.4vw; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .mensaje { transition: opacity .6s; }
  }
</style>
</head>
<body>
<main class="pantalla">
  <section class="reloj">
    <div>
      <p class="saludo" id="saludo"></p>
      <h1 class="dia" id="dia"></h1>
      <p class="fecha" id="fecha"></p>
      <p class="hora" id="hora"></p>
      <p class="momento" id="momento"></p>
    </div>
    <div class="tiempo" id="tiempo" hidden>
      <div id="icono"></div>
      <div>
        <div class="grados" id="grados"></div>
        <p class="estado" id="estado"></p>
        <p class="rango" id="rango"></p>
      </div>
    </div>
  </section>
  <section class="mensajes" id="mensajes" aria-live="polite"></section>
</main>

<script src="config.js"></script>
<script>
(function () {
  var C = window.CONFIG || {};
  var DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var CLAVE = "mensajes-guardados";
  function dameTema() {
    var m = /[?&]tema=([^&#]+)/.exec(location.search), t = "";
    try {
      if (m) { t = decodeURIComponent(m[1]); localStorage.setItem("tema", t); }
      else { t = localStorage.getItem("tema") || ""; }
    } catch (e) { if (m) t = m[1]; }
    return t;
  }
  var TEMA = dameTema();

  function dos(n) { return (n < 10 ? "0" : "") + n; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function leer(k, def) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } }

  /* ---------- Día y hora ---------- */
  function momento(h) {
    if (h < 6) return "de madrugada";
    if (h < 13) return "por la mañana";
    if (h < 20) return "por la tarde";
    return "por la noche";
  }
  function saludo(h) {
    var s = h < 6 ? "Buenas noches" : h < 13 ? "Buenos días" : h < 20 ? "Buenas tardes" : "Buenas noches";
    return C.nombre ? s + ", " + C.nombre : s;
  }
  function relojes() {
    var a = new Date(), h = a.getHours();
    document.getElementById("saludo").textContent = saludo(h);
    document.getElementById("dia").textContent = "Hoy es " + DIAS[a.getDay()];
    document.getElementById("fecha").textContent = a.getDate() + " de " + MESES[a.getMonth()] + " de " + a.getFullYear();
    document.getElementById("hora").textContent = h + ":" + dos(a.getMinutes());
    document.getElementById("momento").textContent = momento(h).charAt(0).toUpperCase() + momento(h).slice(1);
    document.title = "Hoy es " + DIAS[a.getDay()];
  }

  /* ---------- Tiempo (Open-Meteo, sin clave) ---------- */
  var ESTADOS = {
    0: ["Despejado", "sol"], 1: ["Casi despejado", "sol"], 2: ["Algo nublado", "parcial"], 3: ["Nublado", "nube"],
    45: ["Niebla", "niebla"], 48: ["Niebla", "niebla"],
    51: ["Lloviznas", "lluvia"], 53: ["Lloviznas", "lluvia"], 55: ["Lloviznas", "lluvia"],
    61: ["Lluvia", "lluvia"], 63: ["Lluvia", "lluvia"], 65: ["Lluvia fuerte", "lluvia"],
    71: ["Nieve", "nieve"], 73: ["Nieve", "nieve"], 75: ["Nieve", "nieve"],
    80: ["Chubascos", "lluvia"], 81: ["Chubascos", "lluvia"], 82: ["Chubascos fuertes", "lluvia"],
    95: ["Tormenta", "tormenta"], 96: ["Tormenta", "tormenta"], 99: ["Tormenta", "tormenta"]
  };
  var AMA = "#ffc857", BLA = "#e8eef7", AZU = "#7cc4ff";
  function nube(fill) { return '<path d="M26 66a16 16 0 0 1 3-31 22 22 0 0 1 42 5 14 14 0 0 1-2 26z" fill="' + fill + '"/>'; }
  var ICONOS = {
    sol: '<circle cx="50" cy="50" r="18" fill="' + AMA + '"/><g stroke="' + AMA + '" stroke-width="6" stroke-linecap="round"><path d="M50 12v10M50 78v10M12 50h10M78 50h10M23 23l7 7M70 70l7 7M77 23l-7 7M30 70l-7 7"/></g>',
    parcial: '<circle cx="36" cy="38" r="15" fill="' + AMA + '"/><g stroke="' + AMA + '" stroke-width="5" stroke-linecap="round"><path d="M36 10v7M10 38h7M17 19l5 5M55 19l-5 5"/></g>' + '<g transform="translate(14 14) scale(.82)">' + nube(BLA) + '</g>',
    nube: nube(BLA),
    niebla: nube(BLA) + '<g stroke="' + AZU + '" stroke-width="5" stroke-linecap="round"><path d="M24 78h52M32 88h40"/></g>',
    lluvia: nube(BLA) + '<g stroke="' + AZU + '" stroke-width="6" stroke-linecap="round"><path d="M34 76l-4 12M50 76l-4 12M66 76l-4 12"/></g>',
    nieve: nube(BLA) + '<g fill="' + AZU + '"><circle cx="34" cy="82" r="4"/><circle cx="50" cy="88" r="4"/><circle cx="66" cy="82" r="4"/></g>',
    tormenta: nube("#c9d4e3") + '<path d="M52 66l-10 16h9l-5 14 16-20h-10l6-10z" fill="' + AMA + '"/>'
  };
  function tiempo() {
    if (!C.latitud) return;
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + C.latitud + "&longitude=" + C.longitud +
      "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
    var x = new XMLHttpRequest();
    x.open("GET", url);
    x.onload = function () {
      try {
        var d = JSON.parse(x.responseText), cod = d.current.weather_code;
        var e = ESTADOS[cod] || ["", "nube"];
        document.getElementById("icono").innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">' + ICONOS[e[1]] + "</svg>";
        document.getElementById("grados").textContent = Math.round(d.current.temperature_2m) + " grados";
        document.getElementById("estado").textContent = e[0] + (C.ciudad ? " en " + C.ciudad : "");
        document.getElementById("rango").textContent = "Hoy: mínima " + Math.round(d.daily.temperature_2m_min[0]) +
          ", máxima " + Math.round(d.daily.temperature_2m_max[0]);
        document.getElementById("tiempo").hidden = false;
      } catch (err) {}
    };
    x.send();
  }

  /* ---------- Mensajes (ntfy.sh) ---------- */
  var mensajes = leer(CLAVE, []);   // [{id, texto, t}] más nuevo primero

  function cuando(t) {
    var a = new Date(t * 1000), hoy = new Date();
    var mismo = a.toDateString() === hoy.toDateString();
    var ayer = new Date(hoy.getTime() - 86400000).toDateString() === a.toDateString();
    var hora = a.getHours() + ":" + dos(a.getMinutes());
    if (mismo) return "Hoy a las " + hora;
    if (ayer) return "Ayer a las " + hora;
    return DIAS[a.getDay()] + " " + a.getDate() + " a las " + hora;
  }
  function pintar() {
    var cont = document.getElementById("mensajes");
    var lista = mensajes.slice(0, C.maxMensajes || 3);
    if (!lista.length) {
      cont.innerHTML = '<article class="mensaje nuevo vacio"><p class="texto">' + (TEMA ? "Aquí verás los mensajes de tu familia." : "Falta configurar los mensajes.") + '</p></article>';
      return;
    }
    cont.innerHTML = lista.map(function (m, i) {
      return '<article class="mensaje ' + (i === 0 ? "nuevo" : "viejo") + '"><p class="texto">' + esc(m.texto) +
        '</p><p class="cuando">' + cuando(m.t) + "</p></article>";
    }).join("");
  }
  function recibir(m) {
    if (!m || m.event !== "message" || !m.message) return false;
    if (m.message.trim().toLowerCase() === "borrar") {
      if (m.time > borrado) { borrado = m.time; guardar("borrado", borrado); return true; }
      return false;
    }
    if (m.time <= borrado) return false;
    for (var i = 0; i < mensajes.length; i++) if (mensajes[i].id === m.id) return false;
    mensajes.unshift({ id: m.id, texto: m.message, t: m.time });
    return true;
  }
  var borrado = leer("borrado", 0);   // hora del último "borrar"
  var desde = "all";
  function consultar() {
    if (!TEMA) return;
    var x = new XMLHttpRequest();
    x.open("GET", "https://ntfy.sh/" + encodeURIComponent(TEMA) + "/json?poll=1&since=" + desde);
    x.onload = function () {
      if (x.status !== 200) return;
      var cambio = false;
      x.responseText.split("\n").forEach(function (linea) {
        if (!linea) return;
        try { if (recibir(JSON.parse(linea))) cambio = true; } catch (e) {}
      });
      if (cambio) {
        mensajes = mensajes.filter(function (m) { return m.t > borrado; });
        mensajes.sort(function (a, b) { return b.t - a.t; });
        mensajes = mensajes.slice(0, 20);
        guardar(CLAVE, mensajes);
        pintar();
      }
    };
    x.send();
  }

  relojes(); pintar(); tiempo(); consultar();
  setInterval(relojes, 1000);
  setInterval(pintar, 60000);                       // actualiza "Hoy a las…"
  setInterval(tiempo, 30 * 60 * 1000);
  setInterval(consultar, (C.segundosEntreConsultas || 30) * 1000);
})();
</script>
</body>
</html>
