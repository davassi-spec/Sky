name: Rastreador de vuelos desde Menorca

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vuelos
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest discover -s vuelos -p "test_*.py"

      - name: Buscar precios
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vuelos/rastreador.py

      - name: Guardar resultados
        run: |
          git config user.name "rastreador-vuelos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vuelos/data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Vuelos: precios actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
